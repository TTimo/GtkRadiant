<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>

<!--
  Adjusted FontConfig for GtkRadiant.app. Include only paths which Mac users
  will more than likely have.
-->

<!--
  Font directory list
-->
	<dir>/System/Library/Fonts</dir>
	<dir>/Library/Fonts</dir>
	<dir>~/Library/Fonts</dir>
	<dir prefix="xdg">fonts</dir>

<!--
  Accept deprecated 'mono' alias, replacing it with 'monospace'
-->
	<match target="pattern">
		<test qual="any" name="family">
			<string>mono</string>
		</test>
		<edit name="family" mode="assign" binding="same">
			<string>monospace</string>
		</edit>
	</match>

<!--
  Accept alternate 'sans serif' spelling, replacing it with 'sans-serif'
-->
	<match target="pattern">
		<test qual="any" name="family">
			<string>sans serif</string>
		</test>
		<edit name="family" mode="assign" binding="same">
			<string>sans-serif</string>
		</edit>
	</match>

<!--
  Accept deprecated 'sans' alias, replacing it with 'sans-serif'
-->
	<match target="pattern">
		<test qual="any" name="family">
			<string>sans</string>
		</test>
		<edit name="family" mode="assign" binding="same">
			<string>sans-serif</string>
		</edit>
	</match>

<!--
  Map the generic families to macOS fonts. The GL views draw their text
  with "Monospace bold".
-->
	<alias>
		<family>monospace</family>
		<prefer><family>Menlo</family><family>Monaco</family><family>Courier</family></prefer>
	</alias>
	<alias>
		<family>sans-serif</family>
		<prefer><family>Helvetica Neue</family><family>Helvetica</family></prefer>
	</alias>
	<alias>
		<family>serif</family>
		<prefer><family>Times</family></prefer>
	</alias>

<!-- Font cache directory list -->
	<cachedir prefix="xdg">fontconfig</cachedir>

	<config>
<!--
  Rescan configuration every 30 seconds when FcFontSetList is called
 -->
		<rescan>
			<int>30</int>
		</rescan>
	</config>

</fontconfig>

